bookscope:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('BOOKSCOPE_DB_HOST', '127.0.0.1') }}"
      port: "{{ env_var('BOOKSCOPE_DB_PORT', '5433') | int }}"
      user: "{{ env_var('BOOKSCOPE_DB_USER', 'bookscope') }}"
      password: "{{ env_var('BOOKSCOPE_DB_PASSWORD') }}"
      dbname: "{{ env_var('BOOKSCOPE_DB_NAME', 'bookscope') }}"
      schema: silver
      threads: 1
